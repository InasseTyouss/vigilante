name: Sniper Autius

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe/dry = sin reservar · live = sniper · test = reserva 1 clase de prueba"
        default: "live"
        type: choice
        options: [probe, dry, live, test]
      minutes:
        description: "Minutos vigilando"
        default: "90"
      test_date:
        description: "Solo para mode=test: día a reservar (AAAA-MM-DD)"
        default: ""

concurrency:
  group: sniper
  cancel-in-progress: false

jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Sniper
        env:
          MODE: ${{ inputs.mode || 'live' }}
          RUN_MINUTES: ${{ inputs.minutes }}
          TEST_DATE: ${{ inputs.test_date }}
          AUTIUS_COOKIE: ${{ secrets.AUTIUS_COOKIE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python sniper.py
